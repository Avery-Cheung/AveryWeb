<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avery's Mind Palace</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Caveat:wght@600&family=Gloria+Hallelujah&family=Nothing+You+Could+Do&family=Reenie+Beanie&family=Rock+Salt&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-paper: #f4e8d1;
            --ink-main: #2b2b2b;
            --ink-light: #666;
            --accent-red: #d93025;
            --accent-blue: #1a73e8;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-paper);
            font-family: 'Reenie Beanie', cursive;
            cursor: none !important;
        }

        .paper-texture {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iNDAwIj48ZmlsdGVyIGlkPSJub2lzZSI+PHZlRmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMS4yIiBudW1PY3RhdmVzPSIzIiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsdGVyPSJ1cmwoI25vaXNlKSIgb3BhY2l0eT0iMC40Ii8+PC9zdmc+');
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
            mix-blend-mode: multiply;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(30, 20, 10, 0.3) 100%);
            pointer-events: none;
            z-index: 100;
        }

        .ui-hint {
            position: absolute;
            bottom: 30px;
            right: 30px;
            font-size: 24px;
            color: var(--ink-light);
            z-index: 200;
            opacity: 0.7;
            pointer-events: none;
            transform: rotate(-5deg);
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="paper-texture"></div>
    <div class="vignette"></div>
    <div class="ui-hint">Exploration Log: Day 404</div>
    <canvas id="world"></canvas>

<script>
/**
 * AVERY'S INFINITE SKETCHBOOK ENGINE (v1.1 - Bug Fixed)
 * 包含：6层视差 + 修正的点击检测 + 手绘物理模拟
 */

const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');

let width, height, cx, cy;
let frame = 0;

const mouse = { x: 0, y: 0, rawX: 0, rawY: 0 };
const camera = { x: 0, y: 0 };

const PORTALS = [
    {
        id: 'abyss',
        url: 'https://avery-cheung.github.io/Project-ABYSS/',
        title: 'ABYSS',
        sub: 'The Deep End',
        offset: [-300, 120],
        color: '#111',
        layer: 1.0,
        type: 'portal'
    },
    {
        id: 'rog1',
        url: 'https://avery-cheung.github.io/rog1/',
        title: 'ROG1',
        sub: 'System Crash',
        offset: [250, -180],
        color: '#d93025',
        layer: 1.0,
        type: 'portal'
    },
    {
        id: 'rain',
        url: 'https://avery-cheung.github.io/ChillInRain/',
        title: 'RAIN',
        sub: 'Safe House',
        offset: [180, 220],
        color: '#1a73e8',
        layer: 1.0,
        type: 'portal'
    }
];

const DECORATIONS = [];

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    window.addEventListener('mousemove', e => {
        mouse.rawX = e.clientX;
        mouse.rawY = e.clientY;
        mouse.x = (e.clientX - width/2) / (width/2);
        mouse.y = (e.clientY - height/2) / (height/2);
    });

    window.addEventListener('click', handleClick);

    generateWorld();
    animate();
}

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    cx = width / 2;
    cy = height / 2;
}

function generateWorld() {
    DECORATIONS.length = 0;

    for(let i=0; i<width; i+=100) {
        DECORATIONS.push({ type: 'line', x: i-width/2, y: 0, w: 2, h: height, layer: 0.1, color: 'rgba(0,0,0,0.03)' });
    }

    const texts = ['x -> ∞', '404', 'E=mc²', '???', 'void', 'save_me'];
    for(let i=0; i<15; i++) {
        DECORATIONS.push({
            type: 'text',
            text: texts[Math.floor(Math.random()*texts.length)],
            x: (Math.random()-0.5) * 1200,
            y: (Math.random()-0.5) * 800,
            layer: 0.5 + Math.random()*0.1,
            size: 20 + Math.random()*30,
            font: 'Reenie Beanie',
            color: '#aaa'
        });
    }

    DECORATIONS.push({
        type: 'text', text: 'AVERY', x: 0, y: -50, layer: 0.8,
        size: 200, font: 'Rock Salt', color: 'rgba(0,0,0,0.08)'
    });
    DECORATIONS.push({
        type: 'text', text: 'Digital Garden', x: 0, y: 80, layer: 0.85,
        size: 40, font: 'Gloria Hallelujah', color: 'rgba(0,0,0,0.1)'
    });

    for(let i=0; i<8; i++) {
        DECORATIONS.push({
            type: 'shape',
            shape: Math.random() > 0.5 ? 'circle' : 'rect',
            x: (Math.random()-0.5) * 1500,
            y: (Math.random()-0.5) * 1000,
            layer: 2.5,
            size: 10 + Math.random()*20,
            color: '#d93025'
        });
    }

    for(let i=0; i<5; i++) {
        DECORATIONS.push({
            type: 'ink',
            x: (Math.random()-0.5) * 2000,
            y: (Math.random()-0.5) * 1200,
            layer: 4.0 + Math.random(),
            size: 50 + Math.random()*100
        });
    }
}

function jitter(val) { return val + (Math.random()-0.5) * 2; }

function animate() {
    ctx.clearRect(0, 0, width, height);

    const targetCamX = mouse.x * 100;
    const targetCamY = mouse.y * 100;
    camera.x += (targetCamX - camera.x) * 0.05;
    camera.y += (targetCamY - camera.y) * 0.05;

    let renderQueue = [...DECORATIONS, ...PORTALS];
    renderQueue.sort((a, b) => a.layer - b.layer);

    renderQueue.forEach(item => {
        // ⭐ --- BUG FIX --- ⭐
        // 安全地获取物体的原始坐标
        const originX = item.offset ? item.offset[0] : item.x;
        const originY = item.offset ? item.offset[1] : item.y;
        
        let px = cx + originX - (camera.x * item.layer);
        let py = cy + originY - (camera.y * item.layer);

        if (item.type === 'line') {
            px = cx + item.x - (camera.x * item.layer * 0.5);
            py = 0;
        }

        item._renderX = px;
        item._renderY = py;

        drawItem(ctx, item, px, py);
    });

    drawConnections();
    drawCustomCursor();

    frame++;
    requestAnimationFrame(animate);
}

function drawItem(ctx, item, x, y) {
    ctx.save();
    ctx.translate(x, y);

    const depthScale = 0.5 + item.layer * 0.5;
    ctx.scale(depthScale, depthScale);

    if (item.type === 'text') {
        ctx.font = `${item.size}px "${item.font}"`;
        ctx.fillStyle = item.color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.text, 0, 0);
    } 
    else if (item.type === 'shape') {
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        if(item.shape === 'circle') ctx.arc(0,0, item.size, 0, Math.PI*2);
        else ctx.rect(-item.size/2, -item.size/2, item.size, item.size);
        ctx.stroke();
    }
    else if (item.type === 'ink') {
        ctx.fillStyle = '#000';
        ctx.globalAlpha = 0.05;
        ctx.filter = 'blur(4px)';
        ctx.beginPath();
        ctx.arc(0, 0, item.size, 0, Math.PI*2);
        ctx.fill();
        ctx.filter = 'none';
    }
    else if (item.type === 'line') {
        ctx.strokeStyle = item.color;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, height);
        ctx.stroke();
    }
    else if (item.type === 'portal') {
        drawPortal(ctx, item);
    }

    ctx.restore();
}

function drawPortal(ctx, p) {
    const dx = mouse.rawX - p._renderX;
    const dy = mouse.rawY - p._renderY;
    const isHover = Math.hypot(dx, dy) < 80;
    const shake = isHover ? 2 : 0.5;

    ctx.fillStyle = 'rgba(255,255,255, 0.9)';
    ctx.shadowColor = 'rgba(0,0,0,0.2)';
    ctx.shadowBlur = 10;
    ctx.fillRect(-70, -40, 140, 80);
    ctx.shadowBlur = 0;
    
    ctx.strokeStyle = '#ddd';
    ctx.strokeRect(-70, -40, 140, 80);

    ctx.fillStyle = '#222';
    ctx.font = '32px "Amatic SC"';
    ctx.textAlign = 'center';
    ctx.fillText(p.title, jitter(0), -5 + jitter(shake));
    
    if (isHover) {
        ctx.fillStyle = p.color;
        ctx.font = '18px "Caveat"';
        ctx.fillText(p.sub, 0, 25);
    }

    ctx.strokeStyle = isHover ? p.color : '#444';
    ctx.lineWidth = 2;
    
    if (p.id === 'abyss') {
        ctx.beginPath();
        const r = 50;
        for(let i=0; i<Math.PI*4; i+=0.2) {
            const rad = r - i*3;
            if(rad<0) break;
            const px = Math.cos(i + frame*0.1) * rad;
            const py = Math.sin(i + frame*0.1) * rad;
            if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.stroke();
    } else if (p.id === 'rog1') {
        if(isHover) {
            ctx.beginPath();
            ctx.strokeStyle = p.color;
            for(let i=0; i<10; i++) {
                ctx.moveTo((Math.random()-0.5)*120, (Math.random()-0.5)*120);
                ctx.lineTo((Math.random()-0.5)*120, (Math.random()-0.5)*120);
            }
            ctx.stroke();
        } else {
            ctx.strokeRect(-50, -50, 100, 100);
        }
    } else if (p.id === 'rain') {
        ctx.beginPath();
        for(let i=-2; i<=2; i++) {
            const rx = i*15;
            const ry = -50 + (frame*4 + i*10)%80;
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx, ry+10);
        }
        ctx.stroke();
    }
}

function drawConnections() {
    const p1 = PORTALS[0];
    const p2 = PORTALS[1];
    const p3 = PORTALS[2];

    if (!p1._renderX) return;

    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.setLineDash([5, 10]);
    ctx.lineWidth = 1.5;
    
    ctx.beginPath();
    ctx.moveTo(p1._renderX, p1._renderY);
    ctx.lineTo(p2._renderX, p2._renderY);
    ctx.lineTo(p3._renderX, p3._renderY);
    ctx.closePath();
    ctx.stroke();
    
    ctx.restore();
}

const trail = [];
function drawCustomCursor() {
    trail.push({x: mouse.rawX, y: mouse.rawY});
    if(trail.length > 10) trail.shift();

    if(trail.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(40, 40, 40, 0.3)';
        ctx.lineWidth = 2;
        ctx.moveTo(trail[0].x, trail[0].y);
        for(let i=1; i<trail.length; i++) {
            ctx.lineTo(trail[i].x, trail[i].y);
        }
        ctx.stroke();
    }

    ctx.beginPath();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    const r = 10 + Math.sin(frame*0.2)*2;
    ctx.arc(mouse.rawX, mouse.rawY, r, 0, Math.PI*2);
    ctx.stroke();
    
    ctx.fillStyle = '#d93025';
    ctx.beginPath();
    ctx.arc(mouse.rawX, mouse.rawY, 3, 0, Math.PI*2);
    ctx.fill();
    
    ctx.font = '14px "Reenie Beanie"';
    ctx.fillStyle = '#666';
    ctx.fillText(`x:${Math.round(mouse.x*100)}`, mouse.rawX + 15, mouse.rawY + 15);
}

function handleClick(e) {
    const clickX = e.clientX;
    const clickY = e.clientY;

    PORTALS.forEach(p => {
        if (!p._renderX) return;
        const dist = Math.hypot(clickX - p._renderX, clickY - p._renderY);
        if (dist < 80) {
            console.log("Navigating to:", p.url);
            window.location.href = p.url;
        }
    });
}

init();

</script>
</body>
</html>
